<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ШИНСЕРВИС — Личный кабинет</title>
<style>
:root{
  --bg:#0f1720; --card:#fff; --ink:#16202c; --muted:#7c8a99;
  --line:#e3e9f0; --accent:#ff6b1a; --dark:#1f2a37;
  --ok:#16a34a; --warn:#f59e0b; --danger:#e11d48; --blue:#2563eb;
  --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;background:#eef2f7;color:var(--ink);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:14px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}

/* HEADER */
.header{background:var(--dark);color:#fff;padding:0 22px;display:flex;align-items:center;gap:16px;height:64px;position:sticky;top:0;z-index:20;box-shadow:0 2px 20px rgba(10,20,35,.15)}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.3px;font-size:16px;color:#fff}
.logo .mark{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--accent);font-size:16px}
.logo small{opacity:.55;font-weight:600;letter-spacing:2px;font-size:11px}
.nav{display:flex;gap:4px;margin-left:22px}
.nav button{background:transparent;border:0;color:#a9b6c5;padding:9px 14px;border-radius:9px;cursor:pointer;font-weight:600;transition:.15s}
.nav button:hover{color:#fff;background:rgba(255,255,255,.08)}
.nav button.active{color:#fff;background:rgba(255,107,26,.25)}
.header .spacer{flex:1}
.header .user{display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px}

main{padding:26px 22px;max-width:1180px;margin:0 auto}
.page{display:none;animation:fade .2s ease}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* HERO */
.hero{background:linear-gradient(135deg,#1f2a37 0%,#2d3a4b 60%,#3d4d61 100%);color:#fff;border-radius:22px;padding:44px 38px;margin-bottom:26px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;right:-60px;top:-60px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(255,107,26,.35),transparent 70%)}
.hero h1{font-size:32px;font-weight:800;line-height:1.2;max-width:640px;position:relative;z-index:1}
.hero p{opacity:.8;margin-top:12px;max-width:560px;position:relative;z-index:1}
.hero .cta{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap;position:relative;z-index:1}

/* BUTTONS */
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 18px;border-radius:11px;cursor:pointer;font-weight:600;transition:.15s;white-space:nowrap}
.btn:hover{background:#f6f8fb;border-color:#cfd8e3;transform:translateY(-1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#e85c0d}
.btn.ghost{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#fff}
.btn.ghost:hover{background:rgba(255,255,255,.2)}
.btn.dark{background:var(--dark);border-color:var(--dark);color:#fff}
.btn.sm{padding:6px 12px;font-size:12.5px;border-radius:9px}
.btn.danger{color:var(--danger);border-color:#f4ccd6}
.btn.danger:hover{background:#fff1f4}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* CARDS */
.card{background:var(--card);border-radius:var(--radius);box-shadow:0 1px 3px rgba(20,35,55,.06),0 14px 32px -22px rgba(20,35,55,.25);padding:22px;margin-bottom:18px}
.card h3{font-size:16px;font-weight:700;margin-bottom:14px}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card-head h3{margin:0}
.card-head .spacer{flex:1}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}

/* SERVICE CARD */
.svc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;transition:.2s;display:flex;flex-direction:column;gap:8px}
.svc:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 12px 24px -16px rgba(255,107,26,.4)}
.svc .name{font-weight:700;font-size:14.5px;line-height:1.35;min-height:38px}
.svc .price{font-size:20px;font-weight:800;color:var(--accent);margin-top:auto}
.svc .unit{font-size:12px;color:var(--muted);font-weight:600}
.svc .type{font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:3px 9px;border-radius:999px;align-self:flex-start}
.t-service{background:#e8f0ff;color:#1d4ed8}
.t-good{background:#fff5e2;color:#a16207}

/* TABLE */
.table-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;background:#fff;min-width:520px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:11px 14px;background:#f7f9fc;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fafcff}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted);font-size:12.5px}

/* BADGES */
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.2px}
.b-ok{background:#e7f7ee;color:#0f7a3d}
.b-warn{background:#fff5e2;color:#a16207}
.b-bad{background:#ffe9ef;color:#b01238}
.b-info{background:#e8f0ff;color:#1d4ed8}
.b-gray{background:#eef2f7;color:#5b6b7c}

/* FORMS */
label{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:600;color:#54627a}
input,select,textarea{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);outline:none;transition:.15s;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,107,26,.13)}
textarea{resize:vertical}
.form{display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:#fff;border-radius:14px;padding:18px;box-shadow:0 1px 3px rgba(20,35,55,.06);border-left:4px solid var(--accent)}
.kpi .lbl{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.kpi .val{font-size:24px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .hint{font-size:12px;color:var(--muted);margin-top:4px}
.kpi.green{border-left-color:var(--ok)}
.kpi.blue{border-left-color:var(--blue)}
.kpi.gray{border-left-color:#94a3b8}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(15,23,32,.55);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:22px;overflow-y:auto;z-index:100}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:20px;width:100%;max-width:520px;box-shadow:0 30px 60px -20px rgba(10,20,35,.5);animation:pop .2s ease}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(-8px)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}
.modal-head h3{font-size:16px;font-weight:700}
.modal-head .spacer{flex:1}
.modal-head .x{border:0;background:#f2f5f9;width:34px;height:34px;border-radius:10px;cursor:pointer;font-size:16px;color:#5b6b7c}
.modal-head .x:hover{background:#e6ebf2}
.modal-body{padding:22px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;padding-top:14px;border-top:1px solid var(--line)}

/* MISC */
.empty{padding:34px 16px;text-align:center;color:var(--muted)}
.empty .big{font-size:32px;opacity:.3;display:block;margin-bottom:8px}
.list-item{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.list-item .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:0 0 auto}
.list-item .grow{flex:1;min-width:0}
.list-item .t{font-weight:600}
.hint{font-size:12.5px;color:var(--muted);margin-top:10px}
.pill{display:inline-block;background:#eef2f7;color:#5b6b7c;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700;margin:2px}

@media(max-width:720px){
  .header{padding:0 14px;gap:10px;flex-wrap:nowrap;overflow-x:auto}
  .nav{margin-left:8px}
  .nav button{padding:8px 10px;font-size:13px}
  .hero{padding:28px 22px}
  .hero h1{font-size:22px}
  main{padding:16px 14px}
  .grid2{grid-template-columns:1fr}
  .user span.name{display:none}
}
</style>
</head>
<body>

<header class="header">
  <div class="logo"><span class="mark">◉</span> ШИНСЕРВИС <small>КЛИЕНТ</small></div>
  <nav class="nav">
    <button data-page="home" class="active">Услуги</button>
    <button data-page="cabinet">Личный кабинет</button>
    <button data-page="book">Записаться</button>
  </nav>
  <div class="spacer"></div>
  <div id="userBox"></div>
</header>

<main>

<!-- ================= ГЛАВНАЯ ================= -->
<section id="page-home" class="page active">
  <div class="hero">
    <h1>Профессиональный шиномонтаж и сезонное хранение колёс</h1>
    <p>Работаем с R13 по R22. Балансировка, ремонт проколов, хранение комплектов в отапливаемом складе с маркировкой и учётом.</p>
    <div class="cta">
      <button class="btn primary" onclick="go('book')">Записаться онлайн</button>
      <button class="btn ghost" onclick="go('home');document.getElementById('priceList').scrollIntoView({behavior:'smooth'})">Смотреть прайс</button>
    </div>
  </div>

  <div class="kpis" id="publicKpis"></div>

  <div class="card" id="priceList">
    <div class="card-head">
      <h3>Прайс-лист</h3>
      <div class="spacer"></div>
      <input id="priceSearch" placeholder="Поиск услуги…" style="max-width:240px">
    </div>
    <div class="grid3" id="priceGrid"></div>
  </div>
</section>

<!-- ================= ЛИЧНЫЙ КАБИНЕТ ================= -->
<section id="page-cabinet" class="page">
  <div id="cabinetContent"></div>
</section>

<!-- ================= ЗАПИСЬ ================= -->
<section id="page-book" class="page">
  <div class="card">
    <h3>Запись на услугу</h3>
    <p class="muted" style="margin-bottom:16px">Оставьте заявку — мы свяжемся для подтверждения времени.</p>
    <div id="bookContent"></div>
  </div>
</section>

</main>

<!-- МОДАЛКА -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modalTitle">Заголовок</h3>
      <div class="spacer"></div>
      <button class="x" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
/* ================= HELPERS ================= */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const uid = () => Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money = n => (Math.round((Number(n)||0)*100)/100).toLocaleString('ru-RU') + ' ₽';
const num = n => (Number(n)||0).toLocaleString('ru-RU');
const today = () => { const d = new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const fmtDate = d => d ? d.split('-').reverse().join('.') : '—';
const hash = s => { let h=0; for(let i=0;i<s.length;i++){h=(h<<5)-h+s.charCodeAt(i);h|=0;} return 'h'+Math.abs(h).toString(36); };
const empty = t => `<div class="empty"><span class="big">◌</span>${esc(t)}</div>`;

/* ================= DB ================= */
const KEY = 'tireCRM_v1';
let db = null;
let session = null; // {userId, clientId}

function freshDB(){ return { clients:[], services:[], warehouse:[], moves:[], storage:[], orders:[], visits:[], expenses:[], users:[] }; }
function saveDB(){ localStorage.setItem(KEY, JSON.stringify(db)); }

function loadDB(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ db = Object.assign(freshDB(), JSON.parse(raw)); }
    else { db = freshDB(); seed(); saveDB(); }
  }catch(e){ db = freshDB(); seed(); saveDB(); }
}

function seed(){
  const S = (name,type,unit,price) => ({id:uid(), name, type, unit, price});
  db.services = [
    S('Шиномонтаж R13–R15 (1 колесо)','service','шт',250),
    S('Шиномонтаж R16–R18 (1 колесо)','service','шт',400),
    S('Балансировка (1 колесо)','service','шт',150),
    S('Ремонт прокола / жгут','service','шт',300),
    S('Сезонная замена комплекта','service','компл',1600),
    S('Хранение колёс (сезон)','service','компл',3000),
    S('Подкачка азотом (1 колесо)','service','шт',100),
    S('Вентиль резиновый','good','шт',50),
    S('Грузик балансировочный','good','шт',15),
    S('Герметик шинный','good','шт',450)
  ];
  db.warehouse = db.services.filter(s => s.type === 'good').map(g => ({ id:uid(), nomId:g.id, qty:20, min:5 }));
  db.users = [{ id:uid(), login:'admin', password:hash('admin123'), role:'admin' }];
  // демо-клиент с аккаунтом
  const c = {id:uid(), name:'Иванов Иван', phone:'+7 900 111-22-33', car:'Toyota Camry · А123ВС77', note:''};
  db.clients.push(c);
  db.users.push({ id:uid(), login:'ivanov', password:hash('12345'), role:'client', clientId:c.id });
}

/* ================= NAV ================= */
function go(page){
  $$('.page').forEach(p => p.classList.remove('active'));
  $('#page-' + page).classList.add('active');
  $$('.nav button').forEach(b => b.classList.toggle('active', b.dataset.page === page));
  window.scrollTo({top:0,behavior:'smooth'});
  if(page === 'cabinet') renderCabinet();
  if(page === 'book') renderBook();
}
$$('.nav button').forEach(b => b.addEventListener('click', () => go(b.dataset.page)));

/* ================= AUTH UI ================= */
function renderUserBox(){
  const box = $('#userBox');
  if(!session){
    box.innerHTML = `<button class="btn ghost sm" onclick="openAuth()">Войти / Регистрация</button>`;
  } else {
    const u = db.users.find(x => x.id === session.userId);
    const name = u?.role === 'admin' ? 'Администратор' : (clientById(u?.clientId)?.name || u.login);
    const ini = (name[0] || '?').toUpperCase();
    box.innerHTML = `
      <div class="user">
        <div class="avatar">${esc(ini)}</div>
        <span class="name">${esc(name)}</span>
        <button class="btn ghost sm" onclick="logout()">Выйти</button>
      </div>`;
  }
}

function openAuth(mode = 'login'){
  const isLogin = mode === 'login';
  openModal(isLogin ? 'Вход в личный кабинет' : 'Регистрация', `
    <form id="authForm" class="form">
      ${!isLogin ? `<label>Ваше имя<input name="name" required placeholder="Иванов Иван"></label>
        <div class="grid2">
          <label>Телефон<input name="phone" placeholder="+7 900 000-00-00"></label>
          <label>Автомобиль<input name="car" placeholder="Марка · номер"></label>
        </div>` : ''}
      <label>Логин<input name="login" required autocomplete="username"></label>
      <label>Пароль<input type="password" name="password" required autocomplete="current-password"></label>
      <div class="modal-actions" style="justify-content:space-between">
        <button type="button" class="btn sm" onclick="${isLogin ? "openAuth('register')" : "openAuth('login')"}">
          ${isLogin ? 'Нет аккаунта? Регистрация' : 'Уже есть аккаунт? Войти'}
        </button>
        <div style="display:flex;gap:8px">
          <button type="button" class="btn" onclick="closeModal()">Отмена</button>
          <button class="btn primary" type="submit">${isLogin ? 'Войти' : 'Зарегистрироваться'}</button>
        </div>
      </div>
    </form>
    ${isLogin ? `<div class="hint">Демо-доступ клиента: <b>ivanov / 12345</b></div>` : ''}
  `);

  $('#authForm').addEventListener('submit', e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const login = f.get('login').trim();
    const password = f.get('password');

    if(isLogin){
      const u = db.users.find(x => x.login === login && x.password === hash(password));
      if(!u){ alert('Неверный логин или пароль'); return; }
      session = { userId: u.id, clientId: u.clientId || null };
    } else {
      if(db.users.some(x => x.login === login)){ alert('Такой логин уже занят'); return; }
      const client = { id:uid(), name:f.get('name').trim(), phone:f.get('phone').trim(), car:f.get('car').trim(), note:'' };
      db.clients.push(client);
      const user = { id:uid(), login, password:hash(password), role:'client', clientId:client.id };
      db.users.push(user);
      session = { userId: user.id, clientId: client.id };
    }
    saveDB(); closeModal(); renderUserBox(); go('cabinet');
  });
}

function logout(){ session = null; renderUserBox(); go('home'); }

function clientById(id){ return db.clients.find(c => c.id === id); }
function serviceById(id){ return db.services.find(s => s.id === id); }
function clientName(id){ return clientById(id)?.name || '—'; }

/* ================= MODAL ================= */
function openModal(title, html){
  $('#modalTitle').textContent = title;
  $('#modalBody').innerHTML = html;
  $('#overlay').classList.add('open');
}
function closeModal(){ $('#overlay').classList.remove('open'); }
$('#overlay').addEventListener('click', e => { if(e.target.id === 'overlay') closeModal(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });

/* ================= ГЛАВНАЯ ================= */
function renderPublic(){
  const services = db.services.filter(s => s.type === 'service').length;
  const goods = db.services.filter(s => s.type === 'good').length;
  const sets = db.storage.filter(s => s.status === 'Хранится').length;

  $('#publicKpis').innerHTML = `
    <div class="kpi blue"><div class="lbl">Услуг в прайсе</div><div class="val">${services}</div></div>
    <div class="kpi"><div class="lbl">Товаров в наличии</div><div class="val">${goods}</div></div>
    <div class="kpi green"><div class="lbl">Комплектов на хранении</div><div class="val">${sets}</div></div>
    <div class="kpi gray"><div class="lbl">График работы</div><div class="val" style="font-size:15px;margin-top:10px">Пн–Вс · 9:00–21:00</div></div>
  `;

  const q = ($('#priceSearch').value || '').toLowerCase().trim();
  const list = db.services.filter(s => !q || s.name.toLowerCase().includes(q));

  $('#priceGrid').innerHTML = list.length ? list.map(s => `
    <div class="svc">
      <span class="type ${s.type === 'service' ? 't-service' : 't-good'}">${s.type === 'service' ? 'Услуга' : 'Товар'}</span>
      <div class="name">${esc(s.name)}</div>
      <div class="price">${money(s.price)}<span class="unit"> / ${esc(s.unit)}</span></div>
    </div>`).join('') : empty('Ничего не найдено');
}
$('#priceSearch')?.addEventListener('input', renderPublic);

/* ================= КАБИНЕТ ================= */
function renderCabinet(){
  const box = $('#cabinetContent');
  if(!session){
    box.innerHTML = `<div class="card"><div class="empty"><span class="big">🔒</span>Войдите, чтобы увидеть личный кабинет<br><br><button class="btn primary" onclick="openAuth()">Войти / Регистрация</button></div></div>`;
    return;
  }
  const u = db.users.find(x => x.id === session.userId);
  if(u.role === 'admin'){
    box.innerHTML = `<div class="card"><div class="empty"><span class="big">🛠</span>Это аккаунт администратора.<br><br><a class="btn primary" href="admin.html">Перейти в админ-панель →</a></div></div>`;
    return;
  }

  const cid = session.clientId;
  const c = clientById(cid);
  const visits = db.visits.filter(v => v.clientId === cid).sort((a,b) => b.date.localeCompare(a.date));
  const storage = db.storage.filter(s => s.clientId === cid);
  const orders = db.orders.filter(o => o.clientId === cid).sort((a,b) => b.date.localeCompare(a.date));
  const totalSpent = visits.reduce((a,v) => a + v.sum, 0);

  box.innerHTML = `
    <div class="card">
      <div class="card-head">
        <div class="avatar" style="width:52px;height:52px;font-size:20px">${esc((c?.name || '?')[0].toUpperCase())}</div>
        <div>
          <h3 style="margin:0">${esc(c?.name || u.login)}</h3>
          <div class="muted">${esc(c?.phone || '')} · ${esc(c?.car || '')}</div>
        </div>
        <div class="spacer"></div>
        <button class="btn" onclick="openProfileEdit()">Редактировать профиль</button>
      </div>
    </div>

    <div class="kpis">
      <div class="kpi green"><div class="lbl">Всего визитов</div><div class="val">${visits.length}</div></div>
      <div class="kpi blue"><div class="lbl">Потрачено</div><div class="val">${money(totalSpent)}</div></div>
      <div class="kpi"><div class="lbl">Комплектов на хранении</div><div class="val">${storage.filter(s => s.status === 'Хранится').length}</div></div>
      <div class="kpi gray"><div class="lbl">Заказов</div><div class="val">${orders.length}</div></div>
    </div>

    <div class="card">
      <div class="card-head"><h3>История услуг</h3></div>
      <div class="table-wrap"><table>
        <thead><tr><th>Дата</th><th>Услуга</th><th class="num">Кол-во</th><th class="num">Сумма</th></tr></thead>
        <tbody>${visits.length ? visits.map(v => `
          <tr>
            <td>${fmtDate(v.date)}</td>
            <td>${esc(serviceById(v.serviceId)?.name || '—')}${v.comment ? `<div class="muted">${esc(v.comment)}</div>` : ''}</td>
            <td class="num">${num(v.qty)}</td>
            <td class="num"><b>${money(v.sum)}</b></td>
          </tr>`).join('') : `<tr><td colspan="4">${empty('Пока нет визитов')}</td></tr>`}
        </tbody>
      </table></div>
    </div>

    <div class="card">
      <div class="card-head"><h3>Мои колёса на хранении</h3></div>
      <div class="table-wrap"><table>
        <thead><tr><th>Маркировка</th><th>Комплект</th><th>Ячейка</th><th>Сезон</th><th>Принято</th><th>Статус</th></tr></thead>
        <tbody>${storage.length ? storage.map(s => `
          <tr>
            <td><b>${esc(s.mark)}</b></td>
            <td>${esc(s.setDesc)}</td>
            <td>${esc(s.location)}</td>
            <td>${esc(s.season)}</td>
            <td>${fmtDate(s.dateIn)}</td>
            <td><span class="badge ${s.status === 'Хранится' ? 'b-ok' : 'b-gray'}">${s.status}</span></td>
          </tr>`).join('') : `<tr><td colspan="6">${empty('Нет комплектов на хранении')}</td></tr>`}
        </tbody>
      </table></div>
    </div>

    <div class="card">
      <div class="card-head"><h3>Мои заказы и заявки</h3></div>
      <div class="table-wrap"><table>
        <thead><tr><th>Дата</th><th>Позиции</th><th class="num">Сумма</th><th>Статус</th></tr></thead>
        <tbody>${orders.length ? orders.map(o => `
          <tr>
            <td>${fmtDate(o.date)}</td>
            <td class="muted">${o.items.map(i => esc(serviceById(i.nomId)?.name || '—')).join(', ') || '—'}</td>
            <td class="num"><b>${money(o.items.reduce((a,i) => a+i.qty*i.price, 0))}</b></td>
            <td><span class="badge ${o.status === 'Заявка' ? 'b-warn' : o.status === 'Бронь' ? 'b-info' : o.status === 'Выдан' ? 'b-ok' : 'b-gray'}">${o.status}</span></td>
          </tr>`).join('') : `<tr><td colspan="4">${empty('Заказов нет')}</td></tr>`}
        </tbody>
      </table></div>
    </div>
  `;
}

function openProfileEdit(){
  const c = clientById(session.clientId);
  openModal('Редактировать профиль', `
    <form id="profForm" class="form">
      <label>ФИО<input name="name" required value="${esc(c.name)}"></label>
      <div class="grid2">
        <label>Телефон<input name="phone" value="${esc(c.phone || '')}"></label>
        <label>Автомобиль<input name="car" value="${esc(c.car || '')}"></label>
      </div>
      <label>Заметка<textarea name="note" rows="2">${esc(c.note || '')}</textarea></label>
      <div class="modal-actions">
        <button type="button" class="btn" onclick="closeModal()">Отмена</button>
        <button class="btn primary" type="submit">Сохранить</button>
      </div>
    </form>`);
  $('#profForm').addEventListener('submit', e => {
    e.preventDefault();
    const f = new FormData(e.target);
    Object.assign(c, {
      name:f.get('name').trim(),
      phone:f.get('phone').trim(),
      car:f.get('car').trim(),
      note:f.get('note').trim()
    });
    saveDB(); closeModal(); renderCabinet(); renderUserBox();
  });
}

/* ================= ЗАПИСЬ ================= */
let bookItems = [];
function renderBook(){
  const box = $('#bookContent');
  if(!session || db.users.find(x => x.id === session.userId)?.role !== 'client'){
    box.innerHTML = `<div class="empty"><span class="big">🔒</span>Чтобы записаться, войдите в личный кабинет<br><br><button class="btn primary" onclick="openAuth()">Войти / Регистрация</button></div>`;
    return;
  }
  const services = db.services.filter(s => s.type === 'service');
  box.innerHTML = `
    <form id="bookForm" class="form">
      <div class="grid2">
        <label>Дата<input type="date" name="date" value="${today()}" required></label>
        <label>Удобное время<select name="time">
          <option>09:00–11:00</option><option>11:00–13:00</option><option>13:00–15:00</option>
          <option>15:00–17:00</option><option>17:00–19:00</option><option>19:00–21:00</option>
        </select></label>
      </div>
      <label>Комментарий<textarea name="comment" rows="3" placeholder="Например: переобувка R16, есть литьё…"></textarea></label>

      <div class="hint">Выберите услуги (можно несколько):</div>
      <div id="bookChoices" style="display:flex;flex-direction:column;gap:8px;max-height:280px;overflow:auto;padding:4px">
        ${services.map(s => `
          <label style="flex-direction:row;align-items:center;gap:12px;padding:10px 14px;background:#f7f9fc;border:1px solid var(--line);border-radius:12px;font-weight:500;color:var(--ink);cursor:pointer">
            <input type="checkbox" data-nomid="${s.id}" data-price="${s.price}" onchange="toggleBookItem(this)" style="width:auto">
            <span style="flex:1">${esc(s.name)}</span>
            <b style="color:var(--accent)">${money(s.price)}</b>
          </label>`).join('')}
      </div>

      <div id="bookSummary" class="hint"></div>

      <div class="modal-actions" style="justify-content:flex-end">
        <button class="btn primary" type="submit">Отправить заявку</button>
      </div>
    </form>`;

  $('#bookForm').addEventListener('submit', e => {
    e.preventDefault();
    if(!bookItems.length){ alert('Выберите хотя бы одну услугу'); return; }
    const f = new FormData(e.target);
    db.orders.push({
      id:uid(),
      date:f.get('date'),
      time:f.get('time'),
      clientId:session.clientId,
      status:'Заявка',
      prepay:0,
      comment:f.get('comment').trim(),
      items: bookItems.map(i => ({...i}))
    });
    saveDB();
    bookItems = [];
    alert('Заявка отправлена! Мы свяжемся с вами для подтверждения.');
    go('cabinet');
  });
  renderBookSummary();
}

function toggleBookItem(el){
  const nomId = el.dataset.nomid;
  const price = Number(el.dataset.price);
  if(el.checked) bookItems.push({ nomId, qty:1, price });
  else bookItems = bookItems.filter(i => i.nomId !== nomId);
  renderBookSummary();
}
function renderBookSummary(){
  const box = $('#bookSummary');
  if(!box) return;
  const sum = bookItems.reduce((a,i) => a+i.qty*i.price, 0);
  box.innerHTML = bookItems.length
    ? `Выбрано: ${bookItems.length} · <b style="color:var(--accent)">${money(sum)}</b>`
    : 'Ничего не выбрано';
}

/* ================= INIT ================= */
loadDB();
renderUserBox();
renderPublic();
</script>
</body>
</html>
